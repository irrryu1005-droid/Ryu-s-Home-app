<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>収支管理</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="app">

    <header class="header">
      <a href="../home/home.html" class="home-link">🏠 HOME</a>
      <h1>Finance</h1>
    </header>

    <!-- ナビゲーション -->
    <nav class="nav">
      <button class="nav-btn active" data-tab="input">
        <span class="nav-icon">✏️</span>
        <span class="nav-label">入力</span>
      </button>
      <button class="nav-btn" data-tab="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">ダッシュボード</span>
      </button>
      <button class="nav-btn" data-tab="list">
        <span class="nav-icon">📋</span>
        <span class="nav-label">一覧</span>
      </button>
      <button class="nav-btn" data-tab="accounts">
        <span class="nav-icon">🏦</span>
        <span class="nav-label">口座</span>
      </button>
      <button class="nav-btn" data-tab="planned">
        <span class="nav-icon">📅</span>
        <span class="nav-label">予定支出</span>
      </button>
    </nav>

    <!-- ======== 入力タブ ======== -->
    <main id="tab-input" class="tab-content active">
      <div class="form-center">
      <h1>収支入力</h1>

      <form id="transaction-form">
        <div class="type-toggle">
          <button type="button" class="type-btn expense active" data-type="expense">支出</button>
          <button type="button" class="type-btn income" data-type="income">収入</button>
        </div>

        <div class="form-group">
          <label>日付</label>
          <input type="date" id="input-date" required>
        </div>

        <div class="form-group">
          <label>金額（円）</label>
          <input type="number" id="input-amount" placeholder="0" min="1" required>
        </div>

        <div class="form-group">
          <label>カテゴリ</label>
          <select id="input-category" required></select>
        </div>

        <div class="form-group">
          <label>支払科目</label>
          <select id="input-payment" required></select>
        </div>

        <div class="form-group">
          <label>場所（任意）</label>
          <select id="input-location">
            <option value="">-- 未選択 --</option>
          </select>
          <input type="text" id="input-location-new" placeholder="場所名を入力" style="display:none; margin-top:8px;">
        </div>

        <div class="form-group">
          <label>メモ（任意）</label>
          <input type="text" id="input-memo" placeholder="例：コンビニ、電車など">
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">登録する</button>
      </form>

      <div id="form-message"></div>
      </div><!-- /.form-center -->
    </main>

    <!-- ======== ダッシュボードタブ ======== -->
    <main id="tab-dashboard" class="tab-content">

      <div class="month-nav">
        <button id="dash-prev">＜</button>
        <h2 id="dash-month-label"></h2>
        <button id="dash-next">＞</button>
      </div>

      <div class="summary-cards">
        <div class="card income-card">
          <div class="card-label">収入</div>
          <div class="card-value" id="dash-income">¥0</div>
        </div>
        <div class="card expense-card">
          <div class="card-label">支出</div>
          <div class="card-value" id="dash-expense">¥0</div>
        </div>
        <div class="card profit-card">
          <div class="card-label">損益</div>
          <div class="card-value" id="dash-profit">¥0</div>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="monthly-chart"></canvas>
      </div>

      <h3 class="section-title">カテゴリ別支出</h3>
      <table class="data-table">
        <thead>
          <tr><th>カテゴリ</th><th>金額</th></tr>
        </thead>
        <tbody id="category-tbody">
          <tr><td colspan="2" class="empty-msg">データを読み込み中...</td></tr>
        </tbody>
      </table>
    </main>

    <!-- ======== 一覧タブ ======== -->
    <main id="tab-list" class="tab-content">

      <div class="month-nav">
        <button id="list-prev">＜</button>
        <h2 id="list-month-label"></h2>
        <button id="list-next">＞</button>
      </div>

      <div id="transaction-list">
        <div class="empty-msg">データを読み込み中...</div>
      </div>
    </main>

    <!-- ======== 口座タブ ======== -->
    <main id="tab-accounts" class="tab-content">
      <h1>口座残高</h1>
      <p class="accounts-hint">残高をタップして編集できます</p>
      <div id="accounts-list">
        <div class="empty-msg">データを読み込み中...</div>
      </div>
    </main>

    <!-- ======== 予定支出タブ ======== -->
    <main id="tab-planned" class="tab-content">

      <div class="planned-header">
        <div class="month-nav">
          <button id="planned-prev">＜</button>
          <h2 id="planned-month-label"></h2>
          <button id="planned-next">＞</button>
        </div>
        <button id="btn-add-planned" class="btn-primary-sm">＋ 追加</button>
      </div>

      <div class="planned-total-card">
        <span class="planned-total-label">今月の予定支出合計</span>
        <span class="planned-total-val" id="planned-total">¥0</span>
      </div>

      <div id="planned-list"></div>

      <!-- 追加・編集モーダル -->
      <div id="planned-modal" hidden>
        <div class="form-card planned-modal-card">
          <h3 id="planned-form-title">予定支出を追加</h3>
          <form id="planned-form" novalidate>
            <div class="form-group">
              <label>名前</label>
              <input type="text" name="name" placeholder="定期代・奨学金返済など" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>金額 (¥)</label>
                <input type="number" name="amount" min="1" placeholder="15000" required>
              </div>
              <div class="form-group">
                <label>カテゴリ</label>
                <select name="category">
                  <option value="transport">🚃 交通</option>
                  <option value="loan">💴 ローン・返済</option>
                  <option value="utility">💡 光熱費・通信</option>
                  <option value="other">📦 その他</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>頻度</label>
                <select name="frequency" id="planned-frequency">
                  <option value="monthly">毎月</option>
                  <option value="yearly">毎年</option>
                  <option value="quarterly">3ヶ月ごと</option>
                  <option value="once">一回のみ</option>
                </select>
              </div>
              <div class="form-group" id="planned-day-wrap">
                <label>引き落とし日</label>
                <input type="number" name="billingDay" min="1" max="31" placeholder="25">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>開始日</label>
                <input type="date" name="startDate">
              </div>
              <div class="form-group">
                <label>終了日（任意）</label>
                <input type="date" name="endDate">
              </div>
            </div>
            <div class="form-group">
              <label>メモ（任意）</label>
              <input type="text" name="note" placeholder="備考など">
            </div>
            <div class="form-btns">
              <button type="button" id="btn-cancel-planned" class="btn-cancel">キャンセル</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
            <input type="hidden" name="id">
          </form>
        </div>
      </div>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
