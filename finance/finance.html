<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>収支管理</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="app">

    <header class="header">
      <a href="../home/home.html" class="home-link">🏠 HOME</a>
      <h1>Finance</h1>
    </header>

    <!-- ナビゲーション -->
    <nav class="nav">
      <button class="nav-btn active" data-tab="input">
        <span class="nav-icon">✏️</span>
        <span class="nav-label">入力</span>
      </button>
      <button class="nav-btn" data-tab="dashboard">
        <span class="nav-icon">📊</span>
        <span class="nav-label">ダッシュボード</span>
      </button>
      <button class="nav-btn" data-tab="list">
        <span class="nav-icon">📋</span>
        <span class="nav-label">一覧</span>
      </button>
      <button class="nav-btn" data-tab="accounts">
        <span class="nav-icon">🏦</span>
        <span class="nav-label">口座</span>
      </button>
      <button class="nav-btn" data-tab="planned">
        <span class="nav-icon">📅</span>
        <span class="nav-label">予定支出</span>
      </button>
      <button class="nav-btn" data-tab="pnl">
        <span class="nav-icon">📒</span>
        <span class="nav-label">損益</span>
      </button>
    </nav>

    <!-- ======== 入力タブ ======== -->
    <main id="tab-input" class="tab-content active">
      <div class="form-center">
      <h1>収支入力</h1>

      <form id="transaction-form">
        <div class="type-toggle">
          <button type="button" class="type-btn expense active" data-type="expense">支出</button>
          <button type="button" class="type-btn income" data-type="income">収入</button>
        </div>

        <div class="form-group">
          <label>日付</label>
          <input type="date" id="input-date" required>
        </div>

        <div class="form-group">
          <label>金額（円）</label>
          <input type="number" id="input-amount" placeholder="0" min="1" required>
        </div>

        <div class="form-group">
          <label>カテゴリ</label>
          <div class="category-row">
            <select id="input-category" required></select>
            <button type="button" id="btn-manage-categories" class="btn-add-league" title="カテゴリを管理">⚙</button>
          </div>
          <div id="new-category-wrap" class="new-category-wrap" style="display:none">
            <input type="text" id="input-new-category" class="new-category-input" placeholder="新しいカテゴリ名">
            <button type="button" id="btn-save-new-category" class="submit-btn new-category-btn">追加</button>
          </div>
        </div>

        <div class="form-group">
          <label>支払科目</label>
          <select id="input-payment" required></select>
        </div>

        <div class="form-group">
          <label>場所（任意）</label>
          <select id="input-location">
            <option value="">-- 未選択 --</option>
          </select>
          <input type="text" id="input-location-new" placeholder="場所名を入力" style="display:none; margin-top:8px;">
        </div>

        <div class="form-group">
          <label>メモ（任意）</label>
          <input type="text" id="input-memo" placeholder="例：コンビニ、電車など">
        </div>

        <button type="submit" id="submit-btn" class="submit-btn">登録する</button>
      </form>

      <div id="form-message"></div>
      </div><!-- /.form-center -->
    </main>

    <!-- ======== ダッシュボードタブ ======== -->
    <main id="tab-dashboard" class="tab-content">

      <div class="month-nav">
        <button id="dash-prev">＜</button>
        <h2 id="dash-month-label"></h2>
        <button id="dash-next">＞</button>
      </div>

      <div class="summary-cards">
        <div class="card income-card">
          <div class="card-label">収入</div>
          <div class="card-value" id="dash-income">¥0</div>
        </div>
        <div class="card expense-card">
          <div class="card-label">支出</div>
          <div class="card-value" id="dash-expense">¥0</div>
        </div>
        <div class="card profit-card">
          <div class="card-label">損益</div>
          <div class="card-value" id="dash-profit">¥0</div>
        </div>
      </div>

      <div class="chart-container">
        <canvas id="monthly-chart"></canvas>
      </div>

      <h3 class="section-title">カテゴリ別支出</h3>
      <table class="data-table">
        <thead>
          <tr><th>カテゴリ</th><th>金額</th></tr>
        </thead>
        <tbody id="category-tbody">
          <tr><td colspan="2" class="empty-msg">データを読み込み中...</td></tr>
        </tbody>
      </table>
    </main>

    <!-- ======== 一覧タブ ======== -->
    <main id="tab-list" class="tab-content">

      <div class="month-nav">
        <button id="list-prev">＜</button>
        <h2 id="list-month-label"></h2>
        <button id="list-next">＞</button>
      </div>

      <div class="list-sort-bar">
        <span class="sort-label">並び替え</span>
        <button class="sort-btn active" data-key="date" data-asc="false">日付 ▼</button>
        <button class="sort-btn" data-key="date" data-asc="true">日付 ▲</button>
        <button class="sort-btn" data-key="amount" data-asc="false">金額 ▼</button>
        <button class="sort-btn" data-key="amount" data-asc="true">金額 ▲</button>
      </div>

      <div id="transaction-list">
        <div class="empty-msg">データを読み込み中...</div>
      </div>
    </main>

    <!-- ======== 口座タブ ======== -->
    <main id="tab-accounts" class="tab-content">
      <h1>口座残高</h1>
      <p class="accounts-hint">残高をタップして編集できます</p>
      <div id="accounts-list">
        <div class="empty-msg">データを読み込み中...</div>
      </div>
    </main>

    <!-- ======== 予定支出タブ ======== -->
    <main id="tab-planned" class="tab-content">

      <!-- サブタブ -->
      <div class="sub-nav">
        <button class="sub-nav-btn active" data-sub="monthly">📅 月別</button>
        <button class="sub-nav-btn" data-sub="subscriptions">💳 サブスク</button>
        <button class="sub-nav-btn" data-sub="loans">💴 ローン</button>
      </div>

      <!-- ===== 月別ビュー ===== -->
      <div id="sub-monthly" class="sub-content">
        <div class="planned-header">
          <div class="month-nav">
            <button id="planned-prev">＜</button>
            <h2 id="planned-month-label"></h2>
            <button id="planned-next">＞</button>
          </div>
          <button id="btn-add-planned" class="btn-primary-sm">＋ その他追加</button>
        </div>
        <div class="planned-total-card">
          <span class="planned-total-label">今月の予定支出合計</span>
          <span class="planned-total-val" id="planned-total">¥0</span>
        </div>
        <div id="planned-list"></div>
      </div>

      <!-- ===== サブスク管理 ===== -->
      <div id="sub-subscriptions" class="sub-content" hidden>
        <div class="planned-header">
          <h2 class="sub-title">サブスク管理</h2>
          <button id="btn-add-sub-f" class="btn-primary-sm">＋ 追加</button>
        </div>
        <div class="sub-summary" id="sub-summary-f"></div>
        <div id="sub-list-f"></div>
      </div>

      <!-- ===== ローン管理 ===== -->
      <div id="sub-loans" class="sub-content" hidden>
        <div class="planned-header">
          <h2 class="sub-title">ローン・返済管理</h2>
          <button id="btn-add-loan" class="btn-primary-sm">＋ 追加</button>
        </div>
        <div id="loan-list"></div>
      </div>

      <!-- モーダル: その他予定支出 -->
      <div id="planned-modal" hidden>
        <div class="form-card planned-modal-card">
          <h3 id="planned-form-title">予定支出を追加</h3>
          <form id="planned-form" novalidate>
            <div class="form-group">
              <label>名前</label>
              <input type="text" name="name" placeholder="定期代など" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>金額 (¥)</label>
                <input type="number" name="amount" min="1" placeholder="15000" required>
              </div>
              <div class="form-group">
                <label>カテゴリ</label>
                <select name="category">
                  <option value="transport">🚃 交通</option>
                  <option value="utility">💡 光熱費・通信</option>
                  <option value="other">📦 その他</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>頻度</label>
                <select name="frequency" id="planned-frequency">
                  <option value="monthly">毎月</option>
                  <option value="yearly">毎年</option>
                  <option value="quarterly">3ヶ月ごと</option>
                  <option value="once">一回のみ</option>
                </select>
              </div>
              <div class="form-group" id="planned-day-wrap">
                <label>引き落とし日</label>
                <input type="number" name="billingDay" min="1" max="31" placeholder="25">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>開始日</label>
                <input type="date" name="startDate">
              </div>
              <div class="form-group">
                <label>終了日（任意）</label>
                <input type="date" name="endDate">
              </div>
            </div>
            <div class="form-group">
              <label>メモ（任意）</label>
              <input type="text" name="note" placeholder="備考など">
            </div>
            <div class="form-btns">
              <button type="button" id="btn-cancel-planned" class="btn-cancel">キャンセル</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
            <input type="hidden" name="id">
          </form>
        </div>
      </div>

      <!-- モーダル: サブスク -->
      <div id="sub-modal-f" hidden>
        <div class="form-card planned-modal-card">
          <h3 id="sub-form-title-f">サブスクを追加</h3>
          <form id="sub-form-f" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label>サービス名</label>
                <input type="text" name="name" placeholder="Netflix" required>
              </div>
              <div class="form-group">
                <label>契約形態</label>
                <select name="contractForm" id="sub-contract-f">
                  <option value="month">月払い</option>
                  <option value="year">年払い</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>通貨</label>
                <select name="currency">
                  <option value="JPY">¥ 円</option>
                  <option value="USD">$ ドル</option>
                </select>
              </div>
              <div class="form-group" id="sub-cost-month-f">
                <label>月額</label>
                <input type="number" name="costPerMonth" min="0" placeholder="980">
              </div>
              <div class="form-group" id="sub-cost-year-f" hidden>
                <label>年額</label>
                <input type="number" name="costPerYear" min="0" placeholder="9800">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>カテゴリ</label>
                <select name="purpose">
                  <option value="">なし</option>
                  <option value="娯楽">娯楽</option>
                  <option value="勉強">勉強</option>
                  <option value="仕事">仕事</option>
                  <option value="生活必需品">生活必需品</option>
                  <option value="クラウド">クラウド</option>
                  <option value="その他">その他</option>
                </select>
              </div>
              <div class="form-group">
                <label>開始日</label>
                <input type="date" name="startDate">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>支払い方法</label>
                <select name="paymentMethod">
                  <option value="">未設定</option>
                  <option value="クレジットカード">クレジットカード</option>
                  <option value="デビットカード">デビットカード</option>
                  <option value="銀行口座">銀行口座</option>
                  <option value="キャリア決済">キャリア決済</option>
                  <option value="その他">その他</option>
                </select>
              </div>
              <div class="form-group">
                <label>ステータス</label>
                <select name="status">
                  <option value="active">契約中</option>
                  <option value="cancelled">解約済み</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>メモ</label>
              <textarea name="note" rows="2" placeholder="備考など"></textarea>
            </div>
            <div class="form-btns">
              <button type="button" id="btn-cancel-sub-f" class="btn-cancel">キャンセル</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
            <input type="hidden" name="id">
          </form>
        </div>
      </div>

      <!-- モーダル: ローン -->
      <div id="loan-modal" hidden>
        <div class="form-card planned-modal-card">
          <h3 id="loan-form-title">ローンを追加</h3>
          <form id="loan-form" novalidate>
            <div class="form-group">
              <label>名前</label>
              <input type="text" name="name" placeholder="奨学金・借入金など" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>借入総額 (¥)</label>
                <input type="number" name="totalAmount" min="1" placeholder="1000000" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>最小返済額 (¥・任意)</label>
                <input type="number" name="minPayment" min="1" placeholder="10000">
              </div>
              <div class="form-group">
                <label>欽定返済額 (¥)</label>
                <input type="number" name="monthlyPayment" min="1" placeholder="15000" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>残高 (¥)</label>
                <input type="number" name="remainingAmount" min="0" placeholder="800000">
              </div>
              <div class="form-group">
                <label>返済開始日</label>
                <input type="date" name="startDate">
              </div>
            </div>
            <div class="form-group">
              <label>返済終了日（任意）</label>
              <input type="date" name="endDate">
            </div>
            <div class="form-group">
              <label>メモ（任意）</label>
              <input type="text" name="note" placeholder="備考など">
            </div>
            <div class="form-btns">
              <button type="button" id="btn-cancel-loan" class="btn-cancel">キャンセル</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
            <input type="hidden" name="id">
          </form>
        </div>
      </div>

    </main>

  </div>

    <!-- ======== 損益タブ ======== -->
    <main id="tab-pnl" class="tab-content">
      <div class="month-nav">
        <button id="fin-pnl-prev">＜</button>
        <h2 id="fin-pnl-month-label"></h2>
        <button id="fin-pnl-next">＞</button>
      </div>
      <div id="fin-pnl-container"></div>
    </main>

  <!-- 編集モーダル -->
  <div id="edit-modal-overlay" class="edit-modal-overlay" style="display:none">
    <div class="edit-modal-card">
      <h3>記録を編集</h3>
      <form id="edit-form" novalidate>
        <div class="type-toggle">
          <button type="button" class="type-btn edit-type-btn expense active" data-type="expense">支出</button>
          <button type="button" class="type-btn edit-type-btn income" data-type="income">収入</button>
        </div>
        <div class="form-group">
          <label>日付</label>
          <input type="date" name="date" required>
        </div>
        <div class="form-group">
          <label>金額（円）</label>
          <input type="number" name="amount" min="1" required>
        </div>
        <div class="form-group">
          <label>カテゴリ</label>
          <select name="category" required></select>
        </div>
        <div class="form-group">
          <label>支払科目</label>
          <select name="payment_method" required></select>
        </div>
        <div class="form-group">
          <label>場所（任意）</label>
          <select name="location"></select>
        </div>
        <div class="form-group">
          <label>メモ（任意）</label>
          <input type="text" name="memo" placeholder="例：コンビニ、電車など">
        </div>
        <div class="form-btns">
          <button type="button" id="btn-edit-cancel" class="btn-cancel">キャンセル</button>
          <button type="submit" id="btn-edit-save" class="btn-primary">保存</button>
        </div>
        <input type="hidden" name="id">
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
