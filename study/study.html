    <header class="header">
      <h1>Study</h1>
      <button id="btn-refresh" class="refresh-btn" title="データを更新">↻</button>
    </header>

    <nav class="pc-app-nav">
      <a href="../home/home.html"       class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Home</a>
      <a href="study.html"              class="pc-app-nav-link active"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>Study</a>
      <a href="../tasks/task.html"      class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg></span>Tasks</a>
      <a href="../health/health.html"   class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></span>Health</a>
      <a href="../finance/finance.html" class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>Finance</a>

    <nav class="nav">
      <button class="nav-btn active" data-tab="reading">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>
        <span class="nav-label">Reading</span>
      </button>
      <button class="nav-btn" data-tab="ielts">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></span>
        <span class="nav-label">IELTS</span>
      </button>
      <button class="nav-btn" data-tab="programming">
        <span class="nav-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg></span>
        <span class="nav-label">Programming</span>
      </button>
    </nav>

    <!-- ======== Reading タブ ======== -->
    <main id="tab-reading" class="tab-content">

      <!-- サマリーバー -->
      <div class="summary-bar">
        <div class="s-item">
          <div class="s-label">読書中</div>
          <div class="s-val" id="count-reading">0</div>
        </div>
        <div class="s-item">
          <div class="s-label">読了</div>
          <div class="s-val" id="count-completed">0</div>
        </div>
        <div class="s-item">
          <div class="s-label">読書前</div>
          <div class="s-val" id="count-unread">0</div>
        </div>
      </div>

      <div class="tab-header">
        <div class="status-filters">
          <button class="filter-btn active" data-status="all">すべて</button>
          <button class="filter-btn" data-status="reading">読書中</button>
          <button class="filter-btn" data-status="unread">読書前</button>
          <button class="filter-btn" data-status="completed">読了</button>
        </div>
        <button id="btn-add-book" class="btn-primary">＋ 追加</button>
      </div>

      <!-- ジャンルフィルター（登録済みジャンルから自動生成） -->
      <div class="cat-filters" id="genre-filters">
        <button class="cat-filter-btn active" data-cat="all">すべて</button>
      </div>

      <div id="book-list"></div>

      <!-- 追加・編集モーダル -->
      <div id="book-modal-overlay" class="modal-overlay" hidden>
        <div class="form-card modal-card">
          <h3 id="book-form-title">本を追加</h3>
          <form id="book-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label>タイトル</label>
                <input type="text" name="title" placeholder="書名" required>
              </div>
              <div class="form-group">
                <label>著者</label>
                <input type="text" name="author" placeholder="著者名">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>ジャンル（カンマ区切り）</label>
                <input type="text" name="genres" placeholder="評論, 認知学">
              </div>
              <div class="form-group">
                <label>ステータス</label>
                <select name="status">
                  <option value="unread">読書前</option>
                  <option value="reading">読書中</option>
                  <option value="completed">読了</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>出版社</label>
                <input type="text" name="publisher" placeholder="岩波書店">
              </div>
              <div class="form-group">
                <label>評価</label>
                <select name="rating">
                  <option value="">未評価</option>
                  <option value="5">★★★★★</option>
                  <option value="4">★★★★☆</option>
                  <option value="3">★★★☆☆</option>
                  <option value="2">★★☆☆☆</option>
                  <option value="1">★☆☆☆☆</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>現在ページ</label>
                <input type="number" name="currentPage" min="0" placeholder="0">
              </div>
              <div class="form-group">
                <label>総ページ数</label>
                <input type="number" name="totalPages" min="1" placeholder="300">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>出版日</label>
                <input type="date" name="publishedDate">
              </div>
              <div class="form-group">
                <label>読書開始日</label>
                <input type="date" name="startedAt">
              </div>
            </div>
            <div class="form-group" id="completed-at-wrap">
              <label>完読日</label>
              <input type="date" name="completedAt">
            </div>
            <div class="form-btns">
              <button type="button" id="btn-cancel-book" class="btn-cancel">キャンセル</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
            <input type="hidden" name="id">
          </form>
        </div>
      </div>

    </main>

    <!-- ======== IELTS タブ ======== -->
    <main id="tab-ielts" class="tab-content" hidden>

      <!-- 目標スコア -->
      <div class="ielts-goal-card">
        <div class="ielts-goal-left">
          <div class="ielts-goal-label">目標スコア</div>
          <div class="ielts-goal-val" id="ielts-goal-val">—</div>
        </div>
        <div class="ielts-goal-right">
          <div class="ielts-goal-label">最新スコア</div>
          <div class="ielts-goal-val" id="ielts-latest-val">—</div>
        </div>
        <button class="btn-ghost" id="btn-edit-goal">目標を設定</button>
      </div>

      <!-- 学習時間サマリー -->
      <div class="study-time-summary">
        <div class="st-item">
          <div class="st-label">今週</div>
          <div class="st-val" id="study-week">0h</div>
        </div>
        <div class="st-item">
          <div class="st-label">今月</div>
          <div class="st-val" id="study-month">0h</div>
        </div>
        <div class="st-item">
          <div class="st-label">累計</div>
          <div class="st-val" id="study-total">0h</div>
        </div>
      </div>

      <div class="ielts-sections">

        <!-- スコア記録 -->
        <div class="ielts-section-card">
          <div class="ielts-section-header">
            <span class="ielts-section-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg> スコア記録</span>
            <button class="btn-primary btn-sm" id="btn-add-score">＋ 追加</button>
          </div>
          <div id="score-list"></div>
        </div>

        <!-- 学習ログ -->
        <div class="ielts-section-card">
          <div class="ielts-section-header">
            <span class="ielts-section-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></svg> 学習ログ</span>
            <button class="btn-primary btn-sm" id="btn-add-log">＋ 追加</button>
          </div>
          <div id="study-log-list"></div>
        </div>

      </div>

      <!-- スコア追加モーダル -->
      <div id="score-modal-overlay" class="modal-overlay" hidden>
        <div class="form-card modal-card">
          <h3>スコアを記録</h3>
          <form id="score-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label>日付</label>
                <input type="date" name="date" required>
              </div>
              <div class="form-group">
                <label>種別</label>
                <select name="scoreType">
                  <option value="mock">模試</option>
                  <option value="official">本番</option>
                </select>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Overall</label>
                <input type="number" name="overall" step="0.5" min="0" max="9" placeholder="6.5">
              </div>
              <div class="form-group">
                <label>Listening</label>
                <input type="number" name="listening" step="0.5" min="0" max="9" placeholder="6.5">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Reading</label>
                <input type="number" name="reading" step="0.5" min="0" max="9" placeholder="6.5">
              </div>
              <div class="form-group">
                <label>Writing</label>
                <input type="number" name="writing" step="0.5" min="0" max="9" placeholder="6.5">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Speaking</label>
                <input type="number" name="speaking" step="0.5" min="0" max="9" placeholder="6.5">
              </div>
              <div class="form-group">
                <label>メモ</label>
                <input type="text" name="note" placeholder="備考">
              </div>
            </div>
            <div class="form-btns">
              <button type="button" class="btn-cancel modal-close-score">キャンセル</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
            <input type="hidden" name="id">
          </form>
        </div>
      </div>

      <!-- 学習ログ追加モーダル -->
      <div id="log-modal-overlay" class="modal-overlay" hidden>
        <div class="form-card modal-card">
          <h3>学習を記録</h3>
          <form id="log-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label>日付</label>
                <input type="date" name="date" required>
              </div>
              <div class="form-group">
                <label>時間（分）</label>
                <input type="number" name="duration" min="1" placeholder="60" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>セクション</label>
                <select name="section">
                  <option value="overall">総合</option>
                  <option value="listening">Listening</option>
                  <option value="reading">Reading</option>
                  <option value="writing">Writing</option>
                  <option value="speaking">Speaking</option>
                  <option value="vocabulary">単語</option>
                </select>
              </div>
              <div class="form-group">
                <label>メモ</label>
                <input type="text" name="note" placeholder="備考">
              </div>
            </div>
            <div class="form-btns">
              <button type="button" class="btn-cancel modal-close-log">キャンセル</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
            <input type="hidden" name="id">
          </form>
        </div>
      </div>

    </main>

    <!-- ======== Programming タブ ======== -->
    <main id="tab-programming" class="tab-content" hidden>
      <div class="tab-header-simple">
        <h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></svg> Programming 知識メモ</h2>
        <div class="prog-search-wrap">
          <input type="text" id="prog-search" placeholder="キーワード検索...">
        </div>
      </div>
      <div id="prog-list"></div>
    </main>

  </div>
  <script src="study.js"></script>
</body>
</html>
