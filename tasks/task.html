    <!-- ======== ToDo タブ ======== -->
    <section id="tab-todo" class="tab-content active">

      <!-- ---- リストビュー ---- -->
      <div id="view-list">

        <div class="status-filter">
          <button class="status-btn active" data-status="all">すべて</button>
          <button class="status-btn" data-status="will">Will</button>
          <button class="status-btn" data-status="doing">Doing</button>
          <button class="status-btn" data-status="done">Done</button>
        </div>

        <div class="category-filter">
          <button class="cat-btn active" data-cat="all">すべて</button>
          <button class="cat-btn" data-cat="神大">神大</button>
          <button class="cat-btn" data-cat="バイト">バイト</button>
          <button class="cat-btn" data-cat="Betting">Betting</button>
          <button class="cat-btn" data-cat="資格">資格</button>
          <button class="cat-btn" data-cat="その他">その他</button>
        </div>

        <div id="notion-list"></div>

        <div id="todo-list"></div>

        <div class="add-card">
          <div class="add-card-title">＋ タスクを追加</div>
          <form id="todo-form" novalidate>
            <input type="text" id="todo-text" placeholder="タスク名" required>
            <div class="form-row">
              <select id="todo-category">
                <option value="">カテゴリなし</option>
                <option value="バイト">バイト</option>
                <option value="Betting">Betting</option>
                <option value="資格">資格</option>
                <option value="その他">その他</option>
              </select>
              <select id="todo-status">
                <option value="will" selected>Will</option>
                <option value="doing">Doing</option>
                <option value="done">Done</option>
              </select>
              <select id="todo-goal" class="goal-select">
                <option value="">目標なし</option>
              </select>
            </div>
            <div class="form-row due-row">
              <input type="date" id="todo-start" placeholder="開始日">
              <span class="date-sep">〜</span>
              <input type="date" id="todo-due" placeholder="期限">
              <label class="allday-toggle">
                <input type="checkbox" id="todo-allday" checked>
                <span>終日</span>
              </label>
              <input type="time" id="todo-time" class="time-input" disabled>
            </div>
            <!-- 実行予定日 -->
            <div class="schedule-section">
              <div class="schedule-row">
                <span class="schedule-label"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg> 実行予定日</span>
                <input type="date" id="todo-schedule-input">
                <button type="button" id="todo-schedule-add" class="add-schedule-btn">＋追加</button>
              </div>
              <div id="todo-schedule-chips" class="schedule-chips"></div>
            </div>
            <button type="submit" class="add-btn">追加する</button>
          </form>
        </div>

      </div><!-- /view-list -->

      <!-- ---- タイムラインビュー ---- -->
      <div id="view-timeline">

        <div class="tl-controls">
          <button id="tl-prev">＜</button>
          <span id="tl-month-label"></span>
          <button id="tl-next">＞</button>
        </div>

        <div class="tl-container">
          <div class="tl-labels" id="tl-labels"></div>
          <div class="tl-scroll" id="tl-scroll">
            <div class="tl-dates-header" id="tl-dates-header"></div>
            <div class="tl-task-rows" id="tl-task-rows"></div>
          </div>
        </div>

        <div class="tl-hint"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg> 空き行をクリックしてタスクを追加 ／ バーの端をドラッグして期間を変更</div>

      </div><!-- /view-timeline -->

    </section>

    <!-- タイムライン追加モーダル -->
    <div class="tl-overlay" id="tl-overlay">
      <div class="tl-modal">
        <div class="tl-modal-title">＋ タスクを追加</div>
        <form id="tl-add-form" novalidate>
          <input type="text" id="tl-text" placeholder="タスク名" required>
          <div class="tl-form-row">
            <select id="tl-category">
              <option value="">カテゴリなし</option>
              <option value="バイト">バイト</option>
              <option value="Betting">Betting</option>
              <option value="資格">資格</option>
              <option value="その他">その他</option>
            </select>
            <select id="tl-status">
              <option value="will">Will</option>
              <option value="doing">Doing</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="tl-form-row due-row">
            <label>開始 <input type="date" id="tl-start"></label>
            <span class="date-sep">〜</span>
            <label>期限 <input type="date" id="tl-end"></label>
            <label class="allday-toggle">
              <input type="checkbox" id="tl-allday" checked>
              <span>終日</span>
            </label>
            <input type="time" id="tl-time" class="time-input" disabled>
          </div>
          <div class="schedule-section">
            <div class="schedule-row">
              <span class="schedule-label"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg> 実行予定日</span>
              <input type="date" id="tl-schedule-input">
              <button type="button" id="tl-schedule-add" class="add-schedule-btn">＋追加</button>
            </div>
            <div id="tl-schedule-chips" class="schedule-chips"></div>
          </div>
          <div class="tl-modal-btns">
            <button type="button" id="tl-cancel">キャンセル</button>
            <button type="submit" class="tl-submit">追加する</button>
          </div>
        </form>
      </div>
    </div>

    <!-- タイムライン編集モーダル -->
    <div class="tl-overlay" id="tl-edit-overlay">
      <div class="tl-modal">
        <div class="tl-modal-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> タスクを編集</div>
        <form id="tl-edit-form" novalidate>
          <input type="text" id="tl-edit-text" placeholder="タスク名" required>
          <div class="tl-form-row">
            <select id="tl-edit-category">
              <option value="">カテゴリなし</option>
              <option value="神大">神大</option>
              <option value="バイト">バイト</option>
              <option value="Betting">Betting</option>
              <option value="資格">資格</option>
              <option value="その他">その他</option>
            </select>
            <select id="tl-edit-status">
              <option value="will">Will</option>
              <option value="doing">Doing</option>
              <option value="done">Done</option>
            </select>
            <select id="tl-edit-goal" class="goal-select">
              <option value="">目標なし</option>
            </select>
          </div>
          <div class="tl-form-row due-row">
            <label>開始 <input type="date" id="tl-edit-start"></label>
            <span class="date-sep">〜</span>
            <label>期限 <input type="date" id="tl-edit-end"></label>
            <label class="allday-toggle">
              <input type="checkbox" id="tl-edit-allday" checked>
              <span>終日</span>
            </label>
            <input type="time" id="tl-edit-time" class="time-input" disabled>
          </div>
          <div class="schedule-section">
            <div class="schedule-row">
              <span class="schedule-label"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg> 実行予定日</span>
              <input type="date" id="tl-edit-schedule-input">
              <button type="button" id="tl-edit-schedule-add" class="add-schedule-btn">＋追加</button>
            </div>
            <div id="tl-edit-schedule-chips" class="schedule-chips"></div>
          </div>
          <div class="tl-modal-btns">
            <button type="button" id="tl-edit-cancel">キャンセル</button>
            <button type="submit" class="tl-submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Notion の課題を編集するモーダル -->
    <div class="tl-overlay" id="notion-edit-overlay">
      <div class="tl-modal">
        <div class="tl-modal-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> 課題を編集 <span class="notion-sub">Notion に保存されます</span></div>
        <form id="notion-edit-form" novalidate>
          <input type="text" id="ne-title" placeholder="課題名" required>
          <div class="tl-form-row">
            <select id="ne-status">
              <option value="Will">Will</option>
              <option value="Doing">Doing</option>
              <option value="Done">Done</option>
            </select>
            <select id="ne-kind">
              <option value="">種類なし</option>
              <option value="小テスト">小テスト</option>
              <option value="レポート">レポート</option>
              <option value="ミニレポート">ミニレポート</option>
              <option value="アンケート">アンケート</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="tl-form-row">
            <label>準備開始（予習・復習） <input type="date" id="ne-prep"></label>
            <span class="date-sep">〜</span>
            <label>締切 <input type="date" id="ne-due-date"></label>
          </div>
          <div class="tl-form-row">
            <label>締切の時刻（空欄＝終日） <input type="time" id="ne-due-time" class="time-input"></label>
          </div>
          <input type="text" id="ne-method" placeholder="提出方法（例: BEEF+のテスト）">
          <input type="text" id="ne-points" placeholder="配点（例: 5%）">
          <textarea id="ne-memo" class="ne-memo" rows="3" placeholder="メモ"></textarea>
          <div class="ne-error" id="ne-error" hidden></div>
          <div class="tl-modal-btns">
            <button type="button" id="ne-cancel">キャンセル</button>
            <button type="submit" class="tl-submit" id="ne-submit">保存</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ======== Routine タブ ======== -->
    <section id="tab-routine" class="tab-content">

      <div class="routine-date-header" id="routine-date-header"></div>

      <div class="routine-block">
        <div class="routine-block-title">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg> 今日のルーティン
          <span class="routine-block-date" id="routine-record-date"></span>
        </div>
        <div class="routine-items">
          <label class="routine-item">
            <input type="checkbox" data-key="ielts">
            <span class="r-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M16 12h2"/><path d="M16 8h2"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/><path d="M6 12h2"/><path d="M6 8h2"/></svg></span><span>IELTS単語</span>
          </label>
          <label class="routine-item">
            <input type="checkbox" data-key="reading">
            <span class="r-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span><span>読書</span>
          </label>
          <label class="routine-item">
            <input type="checkbox" data-key="training">
            <span class="r-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></span><span>Work out</span>
          </label>
        </div>
        <div class="routine-progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="routine-fill"></div></div>
          <span class="progress-count" id="routine-count">0 / 3</span>
        </div>
      </div>

      <div class="habit-chart-card">
        <div class="habit-chart-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg> Habit Chart <span class="muted">（直近30日）</span></div>
        <div class="habit-chart-legend">
          <span class="legend-dot green"></span>3/3
          <span class="legend-dot yellow"></span>1〜2/3
          <span class="legend-dot gray"></span>0/3
        </div>
        <div class="chart-wrap"><canvas id="habit-chart"></canvas></div>
      </div>

    </section>

    <!-- ======== Plan タブ ======== -->
    <section id="tab-plan" class="tab-content">

      <!-- ロードマップ（12か月） -->
      <div class="plan-card">
        <div class="plan-card-head">
          <span class="plan-card-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg> ロードマップ</span>
          <div class="plan-nav">
            <button id="plan-prev">＜</button>
            <span id="plan-range-label"></span>
            <button id="plan-next">＞</button>
          </div>
        </div>
        <div id="plan-roadmap" class="plan-roadmap"></div>
      </div>

      <!-- 目標カード -->
      <div id="plan-goals"></div>

      <!-- 目標の追加・編集 -->
      <div class="add-card">
        <div class="add-card-title" id="goal-form-title">＋ 目標を追加</div>
        <form id="goal-form" novalidate>
          <input type="text" id="goal-title" placeholder="目標（例: IELTS 7.0）" required>
          <div class="form-row due-row">
            <input type="date" id="goal-start" required>
            <span class="date-sep">〜</span>
            <input type="date" id="goal-end" required>
            <select id="goal-color">
              <option value="#af52de">紫</option>
              <option value="#2980B9">青</option>
              <option value="#34c759">緑</option>
              <option value="#F39C12">オレンジ</option>
              <option value="#ff3b30">赤</option>
              <option value="#95A5A6">グレー</option>
            </select>
          </div>
          <input type="text" id="goal-note" placeholder="メモ（任意）">
          <div class="goal-form-btns">
            <button type="button" id="goal-cancel" class="goal-cancel-btn" hidden>キャンセル</button>
            <button type="submit" class="add-btn" id="goal-submit">追加する</button>
          </div>
        </form>
      </div>

    </section>

  </div>
  <script src="../shared/gcal.js"></script>
  <script src="task.js"></script>
</body>
</html>
