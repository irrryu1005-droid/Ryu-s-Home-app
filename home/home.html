<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <!-- ホーム画面に追加したときのアプリ設定（6つのアプリを1つのアプリとして開く） -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ryu's Home">
  <meta name="theme-color" content="#ffffff">
  <title>HOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="../shared/m-nav.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- ======================================================
       PC版（768px以上で表示）
  ====================================================== -->
  <div id="pc-home" class="pc-only">

    <header class="pc-header">
      <div class="pc-header-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg> HOME</div>
      <button id="btn-refresh" class="refresh-btn" title="データを更新">↻</button>
    </header>

    <nav class="pc-app-nav pc-app-nav-card">
      <a href="home.html"               class="pc-app-nav-link active"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Home</a>
      <a href="../study/study.html"     class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>Study</a>
      <a href="../tasks/task.html"      class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="6" height="6" rx="1"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg></span>Tasks</a>
      <a href="../health/health.html"   class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></span>Health</a>
      <a href="../finance/finance.html" class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>Finance</a>
      <a href="../betting/betting.html" class="pc-app-nav-link"><span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>Betting</a>
    </nav>

    <div class="pc-grid">

      <!-- 時計 -->
      <div class="pc-card clock-card">
        <canvas id="analog-clock" width="180" height="180"></canvas>
        <div class="digital-time" id="digital-time">00:00:00</div>
        <div class="clock-date-sub" id="clock-date-sub"></div>
      </div>

      <!-- 今日の予定 -->
      <div class="pc-card schedule-card">
        <div class="card-title-nav">
          <button class="sch-nav-btn" id="sch-prev">‹</button>
          <span class="card-title" id="sch-date-label"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg> Schedule</span>
          <button class="sch-nav-btn" id="sch-next">›</button>
        </div>
        <div id="schedule-list" class="schedule-list">
          <div class="schedule-loading">読み込み中...</div>
        </div>
        <div class="schedule-add-wrap">
          <button class="schedule-add-toggle" id="schedule-add-toggle">＋ 予定を追加</button>
          <form class="schedule-add-form hidden" id="schedule-add-form">
            <input type="text" id="sch-title" placeholder="タイトル" required>
            <input type="date" id="sch-date" class="sch-date-input">
            <div class="sch-time-row">
              <input type="time" id="sch-start">
              <span class="sch-sep">〜</span>
              <input type="time" id="sch-end">
            </div>
            <select id="sch-calendar" class="sch-calendar-select">
              <option value="primary">読み込み中...</option>
            </select>
            <div class="sch-btns">
              <button type="button" id="sch-cancel">キャンセル</button>
              <button type="submit" id="sch-submit">追加</button>
            </div>
          </form>
        </div>
      </div>

      <!-- ToDo -->
      <div class="pc-card todo-card">
        <div class="card-title-row">
          <div class="card-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/></svg> ToDo</div>
          <button type="button" class="todo-add-open-btn" id="pc-todo-open">＋ 追加</button>
        </div>
        <div class="todo-inner">
          <div class="todo-left">
            <div id="pc-todo-list"></div>
          </div>
          <div class="todo-right">
            <div class="home-tl-controls">
              <button id="home-tl-prev">＜</button>
              <span id="home-tl-month"></span>
              <button id="home-tl-next">＞</button>
            </div>
            <div class="home-tl-wrap">
              <div class="home-tl-labels" id="home-tl-labels"></div>
              <div class="home-tl-scroll" id="home-tl-scroll">
                <div class="home-tl-header" id="home-tl-header"></div>
                <div class="home-tl-rows"   id="home-tl-rows"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

    <!-- ガント編集モーダル -->
    <!-- ToDo を追加するモーダル（「＋ 追加」で開く） -->
    <div class="home-tl-overlay" id="pc-todo-overlay">
            <form id="pc-todo-form" class="todo-add-form home-tl-modal todo-add-modal">
              <div class="home-tl-modal-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/></svg> タスクを追加</div>
              <input type="text" id="pc-todo-input" placeholder="タスク名" required>
              <div class="todo-form-row">
                <select id="pc-todo-category">
                  <option value="">カテゴリなし</option>
                  <option value="バイト">バイト</option>
                  <option value="Betting">Betting</option>
                  <option value="資格">資格</option>
                  <option value="その他">その他</option>
                </select>
                <select id="pc-todo-status">
                  <option value="will">Will</option>
                  <option value="doing">Doing</option>
                  <option value="done">Done</option>
                </select>
              </div>
              <div class="todo-form-dates">
                <label class="todo-date-label">開始<input type="date" id="pc-todo-start"></label>
                <span class="date-sep-sm">〜</span>
                <label class="todo-date-label">期限<input type="date" id="pc-todo-due"></label>
              </div>
              <div class="schedule-section">
                <div class="schedule-row">
                  <span class="schedule-label"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg> 実行予定日</span>
                  <input type="date" id="pc-todo-scheduled-input">
                  <button type="button" id="pc-todo-schedule-add" class="add-schedule-btn">＋追加</button>
                </div>
                <div id="pc-todo-schedule-chips" class="schedule-chips"></div>
              </div>
              <div class="home-tl-modal-btns">
                <button type="button" id="pc-todo-cancel">キャンセル</button>
                <button type="submit" id="pc-todo-submit">追加</button>
              </div>
            </form>
    </div>

    <!-- Notion の課題を編集（Tasks と同じ項目。Notion に保存） -->
    <div class="home-tl-overlay" id="home-ne-overlay">
      <form class="home-tl-modal home-ne" id="home-ne-form" novalidate>
        <div class="home-tl-modal-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> 課題を編集 <span class="home-notion-sub">Notion に保存されます</span></div>
        <input type="text" id="home-ne-title" placeholder="課題名" required>
        <div class="home-tl-form-row">
          <label>状態
            <select id="home-ne-status">
              <option value="Will">Will</option>
              <option value="Doing">Doing</option>
              <option value="Done">Done</option>
            </select>
          </label>
          <label>種類
            <select id="home-ne-kind">
              <option value="">種類なし</option>
              <option value="小テスト">小テスト</option>
              <option value="レポート">レポート</option>
              <option value="ミニレポート">ミニレポート</option>
              <option value="アンケート">アンケート</option>
              <option value="その他">その他</option>
            </select>
          </label>
        </div>
        <div class="home-tl-form-row">
          <label>準備開始（予習・復習）<input type="date" id="home-ne-prep"></label>
          <label>締切<input type="date" id="home-ne-due"></label>
          <label>締切の時刻（空欄＝終日）<input type="time" id="home-ne-time"></label>
        </div>
        <input type="text" id="home-ne-method" placeholder="提出方法">
        <input type="text" id="home-ne-points" placeholder="配点">
        <textarea id="home-ne-memo" rows="3" placeholder="メモ"></textarea>
        <div class="home-ne-error" id="home-ne-error" hidden></div>
        <div class="home-tl-modal-btns">
          <button type="button" id="home-ne-cancel">キャンセル</button>
          <button type="submit" id="home-ne-save">保存</button>
        </div>
      </form>
    </div>

    <div class="home-tl-overlay" id="home-tl-overlay">
      <div class="home-tl-modal">
        <div class="home-tl-modal-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> タスクを編集</div>
        <input type="text" id="home-tl-edit-text" placeholder="タスク名">
        <div class="home-tl-form-row">
          <label><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg> 実行予定日<input type="date" id="home-tl-edit-scheduled"></label>
          <label><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg> 締切日<input type="date" id="home-tl-edit-due"></label>
        </div>
        <div class="home-tl-modal-btns">
          <button id="home-tl-edit-cancel">キャンセル</button>
          <button id="home-tl-edit-save">保存</button>
        </div>
      </div>
    </div>

      <!-- ルーティン -->
      <div class="pc-card routine-card">
        <div class="card-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg> Routine <span class="routine-date-inline" id="routine-today-label"></span></div>
        <div class="routine-items">
          <label class="routine-item">
            <input type="checkbox" data-key="ielts">
            <span class="routine-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M16 12h2"/><path d="M16 8h2"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/><path d="M6 12h2"/><path d="M6 8h2"/></svg></span>
            <span>IELTS単語</span>
          </label>
          <label class="routine-item">
            <input type="checkbox" data-key="reading">
            <span class="routine-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>
            <span>読書</span>
          </label>
          <label class="routine-item">
            <input type="checkbox" data-key="training">
            <span class="routine-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></span>
            <span>Work out</span>
          </label>
        </div>
        <div class="routine-progress-wrap">
          <div class="routine-progress-track">
            <div class="routine-progress-fill" id="routine-progress-fill"></div>
          </div>
          <div class="routine-count" id="routine-count">0 / 3</div>
        </div>
      </div>

      <!-- Habit Chart -->
      <div class="pc-card chart-card">
        <div class="card-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg> Habit Chart <span class="chart-subtitle">（直近30日）</span></div>
        <div class="chart-wrap">
          <canvas id="habit-chart"></canvas>
        </div>
      </div>

    </div><!-- /pc-grid -->

    <!-- 今月の収支 -->
    <div class="pc-card finance-card">
      <div class="card-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg> 今月の収支</div>
      <div class="finance-summary">
        <div class="fin-item">
          <div class="fin-label">収入</div>
          <div class="fin-value income" id="home-income">¥0</div>
        </div>
        <div class="fin-item">
          <div class="fin-label">支出</div>
          <div class="fin-value expense" id="home-expense">¥0</div>
        </div>
        <div class="fin-item">
          <div class="fin-label">損益</div>
          <div class="fin-value" id="home-profit">¥0</div>
        </div>
      </div>
      <a href="../finance/finance.html" class="to-finance-link">収支アプリを開く →</a>
    </div>

  </div><!-- /pc-home -->


  <!-- ======================================================
       モバイル版（768px未満で表示）
  ====================================================== -->
  <div id="mobile-home" class="mobile-only">

    <nav class="m-app-nav" style="display:flex">
      <a href="home.html"               class="m-app-tab active"><span class="m-app-tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Home</a>
      <a href="../study/study.html"     class="m-app-tab"><span class="m-app-tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>Study</a>

      <a href="../health/health.html"   class="m-app-tab"><span class="m-app-tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></span>Health</a>
      <a href="../finance/finance.html" class="m-app-tab"><span class="m-app-tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></span>Finance</a>
      <a href="../betting/betting.html" class="m-app-tab"><span class="m-app-tab-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>Betting</a>
    </nav>

    <!-- ルーティン -->
    <section class="m-section m-routine-section">
      <div class="m-section-head">
        <h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg> Routine <span class="routine-date-inline" id="m-routine-date"></span></h2>
        <span class="m-routine-badge" id="m-routine-count">0 / 3</span>
      </div>
      <div class="routine-items">
        <label class="routine-item">
          <input type="checkbox" data-key="ielts">
          <span class="routine-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M16 12h2"/><path d="M16 8h2"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/><path d="M6 12h2"/><path d="M6 8h2"/></svg></span>
          <span>IELTS</span>
        </label>
        <label class="routine-item">
          <input type="checkbox" data-key="reading">
          <span class="routine-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg></span>
          <span>読書</span>
        </label>
        <label class="routine-item">
          <input type="checkbox" data-key="training">
          <span class="routine-icon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg></span>
          <span>Workout</span>
        </label>
      </div>
    </section>

    <!-- 収支を記録 -->
    <section class="m-section">
      <h2><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg> 収支を記録</h2>
      <div class="type-toggle">
        <button type="button" class="type-btn expense active" data-type="expense">支出</button>
        <button type="button" class="type-btn income" data-type="income">収入</button>
      </div>
      <form id="m-fin-form">
        <div class="form-group">
          <label>金額</label>
          <input type="number" id="m-fin-amount" inputmode="numeric" placeholder="0" required>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>カテゴリ</label>
            <select id="m-fin-category" required></select>
          </div>
          <div class="form-group">
            <label>支払い方法</label>
            <select id="m-fin-payment" required></select>
          </div>
        </div>
        <div class="form-group">
          <label>日付</label>
          <input type="date" id="m-fin-date">
        </div>
        <button type="submit" class="submit-btn" id="m-fin-submit">登録する</button>
        <div id="m-fin-message"></div>
      </form>
    </section>

    <!-- ToDo追加 -->
    <section class="m-section">
      <button type="button" class="m-todo-open-btn" id="m-todo-open-btn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/></svg> ToDoを追加</button>
    </section>

  </div><!-- /mobile-home -->

  <!-- ToDo追加モーダル -->
  <div class="m-todo-modal-overlay hidden" id="m-todo-modal-overlay">
    <div class="m-todo-modal">
      <div class="m-todo-modal-title"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12.5"/><path d="m9 11 3 3L22 4"/></svg> ToDoを追加</div>
      <form id="m-todo-form" novalidate>
        <div class="form-group">
          <label>タスク名</label>
          <input type="text" id="m-todo-text" placeholder="タスクを入力" required>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>カテゴリ</label>
            <select id="m-todo-category">
              <option value="">カテゴリなし</option>
              <option value="バイト">バイト</option>
              <option value="Betting">Betting</option>
              <option value="資格">資格</option>
              <option value="その他">その他</option>
            </select>
          </div>
          <div class="form-group">
            <label>ステータス</label>
            <select id="m-todo-status">
              <option value="will">Will</option>
              <option value="doing">Doing</option>
              <option value="done">Done</option>
            </select>
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-group">
            <label>開始日</label>
            <input type="date" id="m-todo-start">
          </div>
          <div class="form-group">
            <label>期限</label>
            <input type="date" id="m-todo-due">
          </div>
        </div>
        <div class="m-todo-modal-btns">
          <button type="button" id="m-todo-cancel">キャンセル</button>
          <button type="submit" id="m-todo-submit">追加</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../shared/gcal.js"></script>
  <script src="home.js"></script>
</body>
</html>
