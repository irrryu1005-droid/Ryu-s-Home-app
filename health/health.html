<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Health</title>
  <link rel="stylesheet" href="health.css">
  <link rel="stylesheet" href="../shared/m-nav.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div id="app">

    <nav class="m-app-nav">
      <a href="../home/home.html"       class="m-app-tab"><span class="m-app-tab-icon">🏠</span>Home</a>
      <a href="../study/study.html"     class="m-app-tab"><span class="m-app-tab-icon">📚</span>Study</a>
      <a href="../tasks/task.html"      class="m-app-tab"><span class="m-app-tab-icon">✅</span>Tasks</a>
      <a href="health.html"             class="m-app-tab active"><span class="m-app-tab-icon">💪</span>Health</a>
      <a href="../finance/finance.html" class="m-app-tab"><span class="m-app-tab-icon">💰</span>Finance</a>
      <a href="../betting/betting.html" class="m-app-tab"><span class="m-app-tab-icon">🎯</span>Betting</a>
    </nav>

    <header class="header">
      <h1>Health</h1>
      <button id="btn-refresh" class="refresh-btn" title="データを更新">↻</button>
    </header>

    <nav class="pc-app-nav">
      <a href="../home/home.html"       class="pc-app-nav-link"><span>🏠</span>Home</a>
      <a href="../study/study.html"     class="pc-app-nav-link"><span>📚</span>Study</a>
      <a href="../tasks/task.html"      class="pc-app-nav-link"><span>✅</span>Tasks</a>
      <a href="health.html"             class="pc-app-nav-link active"><span>💪</span>Health</a>
      <a href="../finance/finance.html" class="pc-app-nav-link"><span>💰</span>Finance</a>
      <a href="../betting/betting.html" class="pc-app-nav-link"><span>🎯</span>Betting</a>
    </nav>

    <main class="tab-content">

      <!-- 今日の合計 -->
      <div class="summary-bar">
        <div class="s-item">
          <div class="s-label">タンパク質</div>
          <div class="s-val" id="today-protein">0g</div>
        </div>
        <div class="s-item">
          <div class="s-label">脂質</div>
          <div class="s-val" id="today-fat">0g</div>
        </div>
        <div class="s-item">
          <div class="s-label">炭水化物</div>
          <div class="s-val" id="today-carbs">0g</div>
        </div>
        <div class="s-item">
          <div class="s-label">カロリー</div>
          <div class="s-val" id="today-kcal">0kcal</div>
        </div>
      </div>

      <!-- クイックアクション -->
      <div class="action-row">
        <button id="btn-quick-protein" class="btn-quick">⚡ プロテイン20g</button>
        <button id="btn-add-log" class="btn-primary">＋ 記録を追加</button>
      </div>

      <div class="charts-row">
        <!-- 今日のPFCバランス -->
        <div class="chart-card chart-card-pfc">
          <div class="chart-card-header">
            <span class="chart-card-title">🍽 今日のPFCバランス</span>
          </div>
          <div class="chart-wrap chart-wrap-pfc">
            <canvas id="chart-pfc"></canvas>
            <div id="pfc-empty" class="empty-state" hidden>今日の記録がありません</div>
          </div>
        </div>

        <!-- 日別推移グラフ -->
        <div class="chart-card chart-card-trend">
          <div class="chart-card-header">
            <span class="chart-card-title">📊 日別推移</span>
            <div class="range-toggle">
              <button class="range-btn active" data-range="14">2週間</button>
              <button class="range-btn" data-range="30">1ヶ月</button>
              <button class="range-btn" data-range="90">3ヶ月</button>
            </div>
          </div>
          <div class="chart-wrap">
            <canvas id="chart-nutrition"></canvas>
          </div>
        </div>
      </div>

      <!-- 記録一覧 -->
      <div class="tab-header-simple">
        <h2>📋 記録一覧</h2>
      </div>
      <div id="log-list"></div>

      <!-- 記録追加モーダル -->
      <div id="log-modal-overlay" class="modal-overlay" hidden>
        <div class="form-card modal-card">
          <h3>記録を追加</h3>
          <form id="log-form" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label>日付</label>
                <input type="date" name="date" required>
              </div>
              <div class="form-group">
                <label>内容</label>
                <input type="text" name="source" placeholder="例: 朝食・プロテイン">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>タンパク質(g)</label>
                <input type="number" name="amount_g" min="0" placeholder="0" required>
              </div>
              <div class="form-group">
                <label>脂質(g)</label>
                <input type="number" name="fat_g" min="0" placeholder="0">
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>炭水化物(g)</label>
                <input type="number" name="carb_g" min="0" placeholder="0">
              </div>
              <div class="form-group">
                <label>カロリー(kcal)</label>
                <input type="number" name="kcal" min="0" placeholder="未入力ならP/F/Cから自動計算">
              </div>
            </div>
            <div class="form-group">
              <label>メモ</label>
              <input type="text" name="note" placeholder="任意">
            </div>
            <div class="form-btns">
              <button type="button" id="btn-cancel-log" class="btn-cancel">キャンセル</button>
              <button type="submit" class="btn-primary">保存</button>
            </div>
          </form>
        </div>
      </div>

    </main>

  </div>
  <script src="health.js"></script>
</body>
</html>
